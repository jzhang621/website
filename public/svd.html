<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVD lesson (playable)</title><style>
:root{--bmA:.6;--bmB:.2;--bg:#F4F3ED;--ink:#22251F;--muted:#6B6C62;--line:#DAD8CB;--card:#FFFFFF}
:root{--dash:#c4c1b0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1A1B1E;--ink:#ECEBE4;--muted:#9A9B91;--line:#34362F;--card:#25262A;--dash:#4B4D45;--bmA:.5;--bmB:.1;color-scheme:dark}}
:root[data-theme=dark]{--bmA:.5;--bmB:.1;--bg:#1A1B1E;--ink:#ECEBE4;--muted:#9A9B91;--line:#34362F;--card:#25262A;--dash:#4B4D45;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px 16px 60px}
header{max-width:380px;margin:0 auto 18px}
h1{font:800 20px/1.2 inherit}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
#frames{display:flex;flex-direction:column;gap:30px;align-items:center}
.fr{width:350px}
.lab{font:700 12px/1 inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
.phone{width:350px;height:560px;background:var(--bg);border:1.5px solid var(--line);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px 14px}
.cta{padding:12px 14px 18px;border-top:1px solid var(--line);display:flex;justify-content:center}
.cta button{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);font:700 16px inherit;padding:13px 40px;border-radius:14px}
.px{image-rendering:pixelated;display:block;width:100%;height:auto;border-radius:10px;border:1.5px solid var(--line);background:#000}
.pair{display:flex;gap:10px;width:100%}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.tag{font:600 14px "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.tag b{font-weight:600}
.tag.s{font-size:12px;color:var(--muted)}
.slw{display:flex;align-items:center;gap:14px;width:100%;padding:0 6px}
.slw input{flex:1;accent-color:var(--ink);height:34px}
.kv{font:700 22px "IBM Plex Mono",ui-monospace,monospace;width:34px;text-align:center}
.film{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;width:100%}
.it{display:flex;flex-direction:column;align-items:center;gap:6px}
.wipe{position:relative;width:100%;touch-action:none;cursor:ew-resize}
.wipe .px.full{border-radius:12px}
.wipe .over{position:absolute;left:0;top:0}
.wipe .bar{position:absolute;top:0;bottom:0;width:0}
.wipe .bar i{position:absolute;left:-1.5px;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);border-radius:2px}
.wipe .bar i::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25)}
.pair2{display:flex;justify-content:space-between;width:100%;padding:0 8px;margin-top:-14px}
.ttl{font-weight:800;font-size:32px;line-height:1;letter-spacing:-.01em;align-self:center;text-align:center}
.film2{justify-content:flex-start;gap:20px;padding-top:26px}
.og{width:78%;display:flex;flex-direction:column;align-items:center;gap:7px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
.five .px{border-radius:5px;border-width:1px}
.five .it{gap:6px;align-items:center}
.five .tap{cursor:pointer;padding:3px;border-radius:8px;border:1.5px solid transparent}
.five .tap.on{border-color:var(--ink)}
.lab2{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;justify-content:flex-start}
.stk{display:flex;flex-direction:column;gap:1px;width:24px}
.stk i{display:block;height:2px;background:var(--ink);border-radius:1px;opacity:.75}
.peek{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%}
.peek .px{border-radius:5px;border-width:1px}
.peek.rec{grid-template-columns:1fr 1fr;gap:10px 8px}
.tri{display:flex;align-items:center;gap:4px;justify-content:center}
.tri span{font:600 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.tri .sv{width:5px;height:34px;border-radius:1px;border-width:0;flex:none}
.tri .sh{width:50px;height:5px;border-radius:1px;border-width:0;flex:none}
.tri .sm{width:51px;height:34px;border-radius:3px;border-width:1px;flex:none}
.dense{gap:14px;padding-top:22px}
.dense .og{width:44%}
.dense .peek.rec{gap:7px 6px}
.dense .tri .sv{height:26px}.dense .tri .sh{width:40px;height:4px}.dense .tri .sm{width:39px;height:26px}
.cp{font-size:14.5px;line-height:1.45;color:var(--ink);text-align:center;max-width:300px}
.dense .cp{font-size:13.5px;line-height:1.35}
.mid{min-height:0}
.dense{gap:11px;padding-top:16px}
.dense .og{width:38%;gap:5px}
.dense .peek.rec{gap:5px 6px}
.dense .ttl{font-size:28px}
.learn{justify-content:flex-start;gap:22px;padding-top:30px}
.ttl2{font-weight:800;font-size:26px;line-height:1.1;text-align:center}
.card2{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px 12px 22px;display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:6px}
.bub{background:#DFEEE9;color:#25786A;font-weight:800;font-size:15px;padding:7px 16px;border-radius:999px}
.duo{display:flex;align-items:center;gap:6px;width:100%;justify-content:center}
.side{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:46%}
.side .px{border-width:1px;border-radius:8px}
.pill2{background:#ECEAE0;color:var(--muted);font-weight:700;font-size:12.5px;line-height:1.25;padding:6px 11px;border-radius:999px;text-align:center}
.arr{color:var(--muted);font-size:24px;flex:none}
.list{gap:12px;padding-top:22px;justify-content:flex-start;overflow:hidden}
.lcard{flex:1;min-height:0;gap:12px;padding:14px 10px 6px;margin-top:0}
.llist{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 2px 10px}
.lr{display:flex;align-items:center;gap:9px}
.ln{width:16px;text-align:right;font:600 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);flex:none}
.lr .px{width:72px;height:auto;flex:none;border-width:1px;border-radius:5px}
.lt{font-size:13.5px;line-height:1.3;color:var(--ink)}
.addf{justify-content:flex-start;gap:14px;padding-top:18px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:18px;height:6px;border-radius:3px;background:#DAD8CB;transition:background .3s}
.dots i.on{background:var(--ink)}
.addc{margin-top:0;padding:14px 12px 14px;gap:14px}
.big{position:relative;width:100%}
.big .px{width:100%}
.big .b1{position:absolute;left:0;top:0;opacity:0}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:68px}
.addrow .plus{font:700 22px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);flex:none;width:16px;text-align:center}
.addrow .th{width:92px;height:auto;flex:none;border-width:1px;border-radius:6px}
